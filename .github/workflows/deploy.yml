# Factory convention: the workflow triggered by push to main is named deploy.yml
# so /ship can follow it. Everything inside is this project's own design, with
# one rule: a push that changes only factory-managed files (the paths in the
# `plan` job) runs nothing but `plan`. /factory-sync commits must cost seconds.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  plan:
    # Decide what this push needs. Factory-managed files never need a build,
    # a test run or a deploy. Extend the case with this project's own docs-only
    # paths; never remove the factory ones.
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: plan
        run: |
          set -euo pipefail
          deploy=false
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then deploy=true; fi
          while IFS= read -r f; do
            case "$f" in
              .factory-version|AGENTS.md|REVIEW.md|REVIEW.local.md|scripts/factory/README.md|docs/*) ;;  # factory-managed or docs
              *) deploy=true ;;
            esac
          done < <(git diff --name-only HEAD~1 HEAD)
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"
  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # Runs queue under the concurrency group. If main moved while this run
      # waited, the newer commit's run tested and deploys it: this run ends
      # green without deploying, so /ship never sees a red run for a push that
      # was simply overtaken. Gate every later step on this output; only an
      # `if: always()` cleanup may ignore it.
      - name: Confirm main is the commit that passed the checks
        id: guard
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" = "$TESTED_SHA" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded::main moved to $head after $TESTED_SHA was tested; the run for the newer commit deploys it."
          fi
      - name: Deploy
        if: steps.guard.outputs.superseded != 'true'
        # Rio has no remote target: the gate ran on the Mac before the push, and
        # the owner installs the app there with make install.
        run: 'echo "nothing to deploy: Rio is installed on the Mac by make install"'

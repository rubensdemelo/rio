# Main pushes verify Rio. Publishing remains an explicit release.yml action.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/ci-plan.py
  deploy:
    name: Verify pushed commit (no publication)
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

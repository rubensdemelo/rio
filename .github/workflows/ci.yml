name: Rio CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build without release signing
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out Rio
        uses: actions/checkout@v7

      - name: Run the complete shipping gate
        env:
          RIO_FACTORY_DERIVED_DATA: ${{ runner.temp }}/RioDerivedData
        run: bash scripts/factory/gate.sh

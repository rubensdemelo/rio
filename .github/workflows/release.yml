name: Release Rio

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Check out Rio
        uses: actions/checkout@v4

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail

          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID repository variable is required}"
          : "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64:?APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 secret is required}"
          : "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:?APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD secret is required}"
          : "${APPLE_PROVISIONING_PROFILE_BASE64:?APPLE_PROVISIONING_PROFILE_BASE64 secret is required}"
          : "${APPLE_NOTARY_KEY_ID:?APPLE_NOTARY_KEY_ID secret is required}"
          : "${APPLE_NOTARY_ISSUER_ID:?APPLE_NOTARY_ISSUER_ID secret is required}"
          : "${APPLE_NOTARY_PRIVATE_KEY_BASE64:?APPLE_NOTARY_PRIVATE_KEY_BASE64 secret is required}"

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v1.2.3; received $GITHUB_REF_NAME." >&2
            exit 1
          fi

          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/rio.provisionprofile"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/rio-notary-key.p8"

          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/rio-release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/rio-release.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/rio-release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/rio-release.keychain-db" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/rio-release.keychain-db" >/dev/null
          security list-keychain -d user -s "$RUNNER_TEMP/rio-release.keychain-db"

          openssl smime -inform DER -verify -noverify \
            -in "$RUNNER_TEMP/rio.provisionprofile" \
            -out "$RUNNER_TEMP/rio-profile.plist" \
            >/dev/null 2>&1
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/rio-profile.plist")"
          {
            echo "RELEASE_VERSION=$version"
            echo "PROFILE_UUID=$profile_uuid"
            echo "APP_PATH=$RUNNER_TEMP/Rio.xcarchive/Products/Applications/Rio.app"
            echo "DMG_PATH=$GITHUB_WORKSPACE/dist/Rio-$version.dmg"
          } >> "$GITHUB_ENV"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/rio.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.provisionprofile"

      - name: Test Rio
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Rio.xcodeproj \
            -scheme Rio \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/RioDerivedData" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive Rio
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Rio.xcodeproj \
            -scheme Rio \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/RioDerivedData" \
            -archivePath "$RUNNER_TEMP/Rio.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            ENABLE_HARDENED_RUNTIME=YES \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package and notarize Rio
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-keychain-access.sh "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          scripts/package-dmg.sh "$APP_PATH" "$DMG_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/rio-notary-key.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          scripts/verify-release.sh "$APP_PATH" "$DMG_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "$DMG_PATH"
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH" --title "Rio $RELEASE_VERSION" --generate-notes

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/rio-release.keychain-db" >/dev/null 2>&1 || true
          profile_uuid="${PROFILE_UUID:-}"
          if [[ -z "$profile_uuid" && -f "$RUNNER_TEMP/rio-profile.plist" ]]; then
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/rio-profile.plist" 2>/dev/null || true)"
          fi
          if [[ -n "$profile_uuid" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.provisionprofile"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/rio.provisionprofile" "$RUNNER_TEMP/rio-profile.plist" "$RUNNER_TEMP/rio-notary-key.p8"
